<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login – TelegramHelper</title>
<link rel="stylesheet" href="/style.css">
<style>
  main { max-width: 460px; text-align: center; }
  #qr svg { width: 300px; height: 300px; background: #fff; padding: 12px; border-radius: 10px; }
  ol { text-align: left; color: var(--muted); }
</style>
</head>
<body>
<header><h1>Login with QR</h1><span id="state" class="badge">…</span></header>
<main>
  <p class="muted">Send <code>/qr</code> to the control bot first, then scan:</p>
  <div id="qr"></div>
  <ol>
    <li>Open Telegram on your phone</li>
    <li>Settings → Devices → Link Desktop Device</li>
    <li>Scan this QR code</li>
  </ol>
  <p id="msg"></p>
  <p><a href="/">← dashboard</a></p>
</main>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
async function tick() {
  let d = { status: 'idle' };
  try { d = await (await fetch('/api/qr')).json(); } catch (_) {}
  const st = $('state');
  st.textContent = d.status;
  st.className = 'badge ' + (d.status === 'done' ? 'ok' : d.status === 'failed' ? 'bad' : '');
  $('qr').innerHTML = d.svg || '';   // svg is generated by our own server from the login token
  $('msg').textContent = ({
    idle: 'No login in progress. Send /qr to the bot.',
    waiting: d.svg ? 'Waiting for the scan…' : 'Preparing…',
    password: 'Scan accepted. Send your 2FA password to the bot.',
    done: 'Logged in as ' + (d.message || '') + '. You can close this page.',
    failed: 'Failed: ' + (d.message || ''),
  })[d.status] || '';
}
tick(); setInterval(tick, 2000);
</script>
</body>
</html>
